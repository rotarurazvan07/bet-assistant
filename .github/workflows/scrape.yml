name: Matches Scraper

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

# Least-privilege defaults (code-scanning: actions/missing-workflow-permissions
# on every job). Reads for all jobs; the release job overrides with write.
permissions:
  contents: read

env:
  SCRAPE_KIT_LOG_LEVEL: INFO
  SCRAPE_EVENT_LOG_PATH: crawler-events.jsonl
  LOCAL_RUNNER: "self-hosted, linux, bet-runner"

jobs:
  # ── 1. PREPARE (cloud) ─────────────────────────────────────────────────────
  prepare-actions:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize log file
        run: |
          echo "=== Job: prepare-actions started at $(date) ===" > job_log.txt
          : > crawler-events.jsonl

      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --no-cache-dir -r setup/requirements-scrape.txt 2>&1 | tee -a job_log.txt
          scrapling install 2>&1 | tee -a job_log.txt

      - name: Generate Matrix
        id: set-matrix
        run: |
          set -o pipefail
          if JSON_DATA=$(./venv/bin/python -m bet_crawler.crawl --mode prepare-scrape --runners actions --config_dir "config" 2> stderr.log); then
            python_status=0
          else
            python_status=$?
          fi
          # Keep the task-matrix JSON on stdout, but always tee every log line
          # captured from stderr into both the Actions console and job artifact.
          tee -a job_log.txt < stderr.log >&2
          if [ "$python_status" -ne 0 ]; then
            exit "$python_status"
          fi

          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "{\"include\":$JSON_DATA}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload URL files
        uses: actions/upload-artifact@v4
        with:
          name: url-files-actions
          path: "*-urls.txt"
          retention-days: 1

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-prepare-actions
          path: |
            job_log.txt
            crawler-events.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # ── 2. PREPARE (local / self-hosted) ──────────────────────────────────────
  prepare-local:
    runs-on: [self-hosted, linux, bet-runner]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize log file
        run: |
          echo "=== Job: prepare-local started at $(date) ===" > job_log.txt
          : > crawler-events.jsonl


      - name: Generate Matrix
        id: set-matrix
        env:
          PYTHONPATH: /home/runner/work/bet-assistant/bet-assistant:/home/runner/.local/lib/python3.14/site-packages
        run: |
          set -o pipefail
          if JSON_DATA=$(python3 -m bet_crawler.crawl --mode prepare-scrape --runners local --config_dir "config" 2> stderr.log); then
            python_status=0
          else
            python_status=$?
          fi
          # Keep the task-matrix JSON on stdout, but always tee every log line
          # captured from stderr into both the Actions console and job artifact.
          tee -a job_log.txt < stderr.log >&2
          if [ "$python_status" -ne 0 ]; then
            echo "❌ Python script crashed! Printing stderr configurations:" >&2
            exit "$python_status"
          fi

          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "{\"include\":$JSON_DATA}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload URL files
        uses: actions/upload-artifact@v4
        with:
          name: url-files-local
          path: "*-urls.txt"
          retention-days: 1

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-prepare-local
          path: |
            job_log.txt
            crawler-events.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # ── 3. SCRAPE (cloud) ──────────────────────────────────────────────────────
  scrape-actions:
    needs: prepare-actions
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-actions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize log file
        run: |
          echo "=== Job: scrape-actions started at $(date) ===" > job_log.txt
          : > crawler-events.jsonl

      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --no-cache-dir -r setup/requirements-scrape.txt 2>&1 | tee -a job_log.txt
          scrapling install 2>&1 | tee -a job_log.txt
          python3 -m patchright install --with-deps chromium 2>&1 | tee -a job_log.txt

      - name: Download URL files
        uses: actions/download-artifact@v4
        with:
          name: url-files-actions

      - name: Run Scraper
        run: |
          set -o pipefail
          ./venv/bin/python -m bet_crawler.crawl \
            --mode scrape \
            --matches_db_path "${{ matrix.db_path }}" \
            --urls "${{ matrix.urls_file }}" \
            --config_dir "config" \
            2>&1 | tee -a job_log.txt

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.db_path }}
          path: ${{ matrix.db_path }}
          retention-days: 7

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-scrape-actions-${{ matrix.db_path }}
          path: |
            job_log.txt
            crawler-events.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # ── 4. SCRAPE (local / self-hosted) ───────────────────────────────────────
  scrape-local:
    needs: prepare-local
    runs-on: [self-hosted, linux, bet-runner]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-local.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize log file
        run: |
          echo "=== Job: scrape-local started at $(date) ===" > job_log.txt
          : > crawler-events.jsonl


      - name: Download URL files
        uses: actions/download-artifact@v4
        with:
          name: url-files-local

      - name: Run Scraper
        env:
          PYTHONPATH: /home/runner/work/bet-assistant/bet-assistant:/home/runner/.local/lib/python3.14/site-packages
        run: |
          set -o pipefail
          python3 -m bet_crawler.crawl \
            --mode scrape \
            --matches_db_path "${{ matrix.db_path }}" \
            --urls "${{ matrix.urls_file }}" \
            --config_dir "config" \
            2>&1 | tee -a job_log.txt

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.db_path }}
          path: ${{ matrix.db_path }}
          retention-days: 7

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-scrape-local-${{ matrix.db_path }}
          path: |
            job_log.txt
            crawler-events.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # ── 5. MERGE ────────────────────────────────────────────────────────────
  merge:
    needs: [scrape-local, scrape-actions]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Initialize log file
        run: |
          echo "=== Job: merge started at $(date) ===" > job_log.txt
          : > crawler-events.jsonl

      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          pattern: "chunk-*.db"
          merge-multiple: true
          path: .

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --no-cache-dir -r setup/requirements-scrape.txt 2>&1 | tee -a job_log.txt
          scrapling install 2>&1 | tee -a job_log.txt

      - name: Merge Databases
        run: |
          set -o pipefail
          ./venv/bin/python -m bet_crawler.crawl \
            --mode merge \
            --chunks_dir "." \
            --matches_db_path "final_matches.db" \
            --config_dir "config" \
            2>&1 | tee -a job_log.txt

      - name: Upload Final Database
        uses: actions/upload-artifact@v4
        with:
          name: final_matches.db
          path: final_matches.db
          retention-days: 7

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-merge
          path: |
            job_log.txt
            crawler-events.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # ── 6. RELEASE ──────────────────────────────────────────────────────────
  upload-release:
    needs: merge
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    # Release creation (softprops/action-gh-release + GITHUB_TOKEN) needs
    # write; everything else in this workflow stays at the read default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download database
        uses: actions/download-artifact@v4
        with:
          name: final_matches.db

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-db
          name: Latest Matches Database
          files: final_matches.db
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 7. UNIFY LOGS ────────────────────────────────────────────────────────
  unify-logs:
    needs: [prepare-actions, scrape-actions, prepare-local, scrape-local, merge]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Download All Logs
        uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: all_logs
        continue-on-error: true

      - name: Create unified log and problem summary
        if: always()
        env:
          PREPARE_ACTIONS_RESULT: ${{ needs.prepare-actions.result }}
          SCRAPE_ACTIONS_RESULT: ${{ needs.scrape-actions.result }}
          PREPARE_LOCAL_RESULT: ${{ needs.prepare-local.result }}
          SCRAPE_LOCAL_RESULT: ${{ needs.scrape-local.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
        run: |
          mkdir -p all_logs
          echo "=== UNIFIED LOGS FROM ALL JOBS ===" > unified_log.txt
          echo "" >> unified_log.txt
          find all_logs -type f | sort | while read log_file; do
            echo "=== LOG FILE: ${log_file#all_logs/} ===" >> unified_log.txt
            cat "$log_file"                                    >> unified_log.txt
            echo ""                                            >> unified_log.txt
            echo "=== END OF FILE ==="                        >> unified_log.txt
            echo ""                                            >> unified_log.txt
          done

          python3 -m bet_crawler.summarize_scrape_logs \
            --logs-dir all_logs \
            --output-json scrape-summary.json \
            --output-markdown scrape-summary.md \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --job-outcome "prepare-actions=$PREPARE_ACTIONS_RESULT" \
            --job-outcome "scrape-actions=$SCRAPE_ACTIONS_RESULT" \
            --job-outcome "prepare-local=$PREPARE_LOCAL_RESULT" \
            --job-outcome "scrape-local=$SCRAPE_LOCAL_RESULT" \
            --job-outcome "merge=$MERGE_RESULT"

      - name: Upload unified log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-logs
          path: |
            unified_log.txt
            scrape-summary.md
            scrape-summary.json
          if-no-files-found: ignore
          retention-days: 30

  # ── 8. CLEANUP ──────────────────────────────────────────────────────────
  cleanup-artifacts:
    needs: [unify-logs]
    runs-on: ubuntu-22.04
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete intermediate artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            logs-*
            url-files-*
            chunk-*
          failOnError: false
