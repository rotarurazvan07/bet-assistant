name: CI


on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job (CodeQL: actions/missing-workflow-
# permissions). Jobs needing more override at job level — auto-fix below
# sets contents: write for its push-back commit.
permissions:
  contents: read

env:
  # Python configuration
  PYTHON_VERSION: "3.14"

  # Source directories (space-separated for tools like mypy, radon, etc.)
  SRC_DIR: "bet_crawler bet_dashboard/backend bet_framework"
  # All three Python test suites (auto-fix covers the full corpus)
  TEST_DIR: "tests bet_crawler/tests bet_dashboard/backend/tests"

  # Requirements files
  REQUIREMENTS_FILES: |
    bet_dashboard/backend/requirements.txt
    setup/requirements-scrape.txt

  # Additional install commands (scrapling: Camoufox binaries for finders)
  POST_INSTALL_CMDS: "scrapling install"

jobs:
  # ── 1. AUTO-FIX ───────────────────────────────────────────────────────────
  auto-fix:
    name: "Auto-fix"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_FIX_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install auto-fix tools
        run: |
          pip install autoflake pyupgrade autotyping isort ruff

      - name: autoflake — remove unused imports and variables
        run: |
          # Process all source and test directories
          autoflake --in-place --recursive             --remove-all-unused-imports --remove-unused-variables             --exclude .venv,__pycache__             $SRC_DIR $TEST_DIR

      - name: pyupgrade — modernise syntax to Python 3.14+
        run: |
          # CI is 3.14-only (D-F); target the interpreter we actually run
          find $SRC_DIR $TEST_DIR -name "*.py" |             xargs pyupgrade --py314-plus || true

      - name: autotyping — infer trivial return type annotations
        run: |
          # Process all source directories
          python -m autotyping --none-return --scalar-return --bool-param             $SRC_DIR

      - name: isort — sort imports
        run: |
          # Process all source and test directories
          isort --profile black --line-length 127             $SRC_DIR $TEST_DIR

      - name: ruff format
        run: |
          # Process all source and test directories
          ruff format --line-length 127 --target-version py314             $SRC_DIR $TEST_DIR

      - name: ruff lint --fix
        run: |
          # --line-length 127 matches project convention (ruff.toml header
          # + AGENTS.md) — without it ruff defaults to 88 and floods E501s
          ruff check --select E,F,B,C,SIM,PERF --ignore UP --line-length 127           --fix --unsafe-fixes --output-format=concise           $SRC_DIR $TEST_DIR || true

      - name: Commit fixes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to fix — working tree is clean."
          else
            git diff --stat > autofix-diffstat.txt
            git add -A
            git commit -m "chore: auto-fix (types · lint · perf) [skip ci]"
            git push
            echo "Fixes committed and pushed."
          fi

      - name: Write auto-fix summary
        if: always()
        run: |
          {
            echo "## 🔧 Auto-fix"
            echo ""
            if [ "${{ github.event_name }}" != "push" ]; then
              echo "Skipped — runs on pushes only (PR runs skip to avoid clobbering the review branch)."
            elif [ -f autofix-diffstat.txt ]; then
              echo "Committed and pushed fixes:"
              echo ""
              echo '```'
              cat autofix-diffstat.txt
              echo '```'
            else
              echo "✅ Working tree clean — nothing to fix."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 2. TESTS (three per-suite invocations — D-A) ─────────────────────────
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: [auto-fix]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test deps
        run: |
          # Install dependencies from requirements files
          echo "Installing requirements from:"
          echo "$REQUIREMENTS_FILES"
          while IFS= read -r req_file; do
            req_file=$(echo "$req_file" | xargs)  # trim whitespace
            if [ -n "$req_file" ] && [ -f "$req_file" ]; then
              echo "Installing $req_file"
              pip install -r "$req_file"
            elif [ -n "$req_file" ]; then
              echo "Warning: Requirements file not found: $req_file"
            fi
          done <<< "$REQUIREMENTS_FILES"

          # Test dependencies (D-C: asyncio + hypothesis for backend WS
          # strict-mode tests and hypothesis property suites; httpx required
          # by starlette.testclient — backend router tests construct
          # fastapi.testclient.TestClient and CI installs only requirements
          # files, which omit httpx)
          pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-asyncio hypothesis httpx

          # scrapling install: finders import scrape_kit (backed by scrapling
          # Camoufox); crawler tests import the finders package
          if [ -n "$POST_INSTALL_CMDS" ]; then
            echo "Running post-install commands: $POST_INSTALL_CMDS"
            eval "$POST_INSTALL_CMDS"
          fi

      - name: Run tests — framework suite (root tests/)
        # D-A: per-suite invocations. A combined 'pytest tests/ bet_crawler/tests
        # bet_dashboard/backend/tests' from repo root resolves rootdir=repo root
        # where NO pytest.ini exists → per-suite addopts (pythonpath, --cov
        # targets, cycle-14 --cov-fail-under gates) never apply → root suite
        # imports of bet_framework FAIL and all gates vanish. cd per suite makes
        # local = CI exactly.
        # D-B: NO CLI --cov/--cov-fail-under here — they would override the
        # ini gates from cycle 14 (f26a130). Only report formats are added.
        working-directory: tests
        run: |
          python -m pytest             --cov-report=term-missing             --cov-report=xml:coverage-framework.xml             --junitxml=test-results-framework.xml             --timeout=60             -n auto -v

      - name: Run tests — backend suite (bet_dashboard/backend/tests)
        working-directory: bet_dashboard/backend
        run: |
          python -m pytest tests/             --cov-report=term-missing             --cov-report=xml:coverage-backend.xml             --junitxml=test-results-backend.xml             --timeout=60             -n auto -v

      - name: Run tests — crawler suite (bet_crawler/tests)
        working-directory: bet_crawler
        run: |
          python -m pytest tests/             --cov-report=term-missing             --cov-report=xml:coverage-crawler.xml             --junitxml=test-results-crawler.xml             --timeout=60             -n auto -v

      - name: Write test summary
        if: always()
        run: |
          python3 - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          SUITES = [
              ("framework", "tests/test-results-framework.xml", "tests/coverage-framework.xml", 80),
              ("backend", "bet_dashboard/backend/test-results-backend.xml", "bet_dashboard/backend/coverage-backend.xml", 85),
              ("crawler", "bet_crawler/test-results-crawler.xml", "bet_crawler/coverage-crawler.xml", 75),
          ]
          MAX_LISTED = 40

          def parse_junit(path):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  return None, []
              agg = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              fails = []
              for ts in root.iter("testsuite"):
                  for k in agg:
                      agg[k] += int(ts.get(k, "0") or 0)
                  for tc in ts.iter("testcase"):
                      f = tc.find("failure")
                      e = tc.find("error")
                      if (f is None) and (e is None):
                          continue
                      el = f if f is not None else e
                      msg = el.get("message") or (el.text or "")
                      first = msg.strip().splitlines()[0] if msg.strip() else "(no message)"
                      fails.append((tc.get("classname", "?"), tc.get("name", "?"), first[:200]))
              passed = agg["tests"] - agg["failures"] - agg["errors"] - agg["skipped"]
              return (passed, agg["failures"], agg["errors"], agg["skipped"], agg["tests"]), fails

          def cov_pct(path):
              try:
                  root = ET.parse(path).getroot()
                  return round(float(root.get("line-rate", "0")) * 100, 1)
              except Exception:
                  return None

          print("## 🧪 Python Tests (3.14) — 3 suites, coverage gates enforced")
          print()
          print("| Suite | Passed | Failed | Errors | Skipped | Total | Coverage | Gate |")
          print("|---|---|---|---|---|---|---|---|")
          all_fails = []
          for name, junit, cov, gate in SUITES:
              stats, fails = parse_junit(junit)
              if stats is None:
                  print(f"| {name} | ⚠️ no results — suite crashed before junit was written | | | | | — | ≥{gate}% |")
              else:
                  p, fe, er, sk, to = stats
                  c = cov_pct(cov)
                  c_str = f"{c}%" if c is not None else "—"
                  ok = "✅" if (c is not None and c >= gate) else "❌"
                  print(f"| {name} | {p} | {fe} | {er} | {sk} | {to} | {c_str} | {ok} ≥{gate}% |")
              all_fails.append((name, fails))

          if any(f for _, f in all_fails):
              print()
              print("### ❌ Failing tests (file :: test — first failure line)")
              for name, fails in all_fails:
                  if not fails:
                      continue
                  print()
                  print(f"**{name}** — {len(fails)} failure(s):")
                  for cls, tname, first in fails[:MAX_LISTED]:
                      print(f"- `{cls}::{tname}` — {first}")
                  if len(fails) > MAX_LISTED:
                      print(f"- … and {len(fails) - MAX_LISTED} more (see job log)")
          PY

  # ── 3. AUDIT ─────────────────────────────────────────────────────────────
  audit:
    name: "Audit (security · complexity · types · docs)"
    runs-on: ubuntu-latest
    needs: [auto-fix]
    if: always()

    outputs:
      mypy_errors: ${{ steps.mypy.outputs.mypy_errors }}
      bandit_issues: ${{ steps.bandit.outputs.bandit_issues }}
      semgrep_findings: ${{ steps.semgrep.outputs.semgrep_findings }}
      pip_audit_vulns: ${{ steps.pip_audit.outputs.pip_audit_vulns }}
      radon_complexity: ${{ steps.radon.outputs.radon_complexity }}
      vulture_dead: ${{ steps.vulture.outputs.vulture_dead }}
      interrogate_pct: ${{ steps.interrogate.outputs.interrogate_pct }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install audit tools
        run: |
          # Install dependencies from requirements files
          echo "Installing requirements from:"
          echo "$REQUIREMENTS_FILES"
          while IFS= read -r req_file; do
            req_file=$(echo "$req_file" | xargs)  # trim whitespace
            if [ -n "$req_file" ] && [ -f "$req_file" ]; then
              echo "Installing $req_file"
              pip install -r "$req_file"
            elif [ -n "$req_file" ]; then
              echo "Warning: Requirements file not found: $req_file"
            fi
          done <<< "$REQUIREMENTS_FILES"

          # Install audit tools
          pip install bandit pip-audit radon vulture mypy interrogate

          # Set PYTHONPATH to include source directories for local package imports
          echo "PYTHONPATH=$SRC_DIR" >> $GITHUB_ENV

          # Run any post-install commands
          if [ -n "$POST_INSTALL_CMDS" ]; then
            echo "Running post-install commands: $POST_INSTALL_CMDS"
            eval "$POST_INSTALL_CMDS"
          fi

      - name: Install semgrep (via official action)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/auto
        continue-on-error: true

      - name: semgrep — pattern-based security & bug detection
        id: semgrep
        run: |
          if [ -f "semgrep-report.json" ]; then
          SEMGREP_FINDINGS=$(python3 -c "
          import json
          try:
              with open('semgrep-report.json') as f:
                  data = json.load(f)
                  print(len(data.get('results', [])))
          except:
              print('0')
          " 2>/dev/null || echo "0")
          else
            SEMGREP_FINDINGS="0"
          fi
          echo "semgrep_findings=${SEMGREP_FINDINGS}" >> "$GITHUB_OUTPUT"

      - name: mypy — static type checking
        id: mypy
        run: |
          echo "── Type Checking ─────────────────────────────────────────────"
          # D-F: mypy targets the 3.14 interpreter CI actually runs
          mypy $SRC_DIR             --strict             --ignore-missing-imports             --python-version 3.14             --no-error-summary 2>&1 | tee mypy-output.txt || true
          MYPY_ERRORS=$(grep -c "error:" mypy-output.txt 2>/dev/null || echo "0")
          MYPY_ERRORS=$(echo "$MYPY_ERRORS" | tr -d '[:space:]')
          echo "mypy_errors=${MYPY_ERRORS:-0}" >> "$GITHUB_OUTPUT"
          echo "Found ${MYPY_ERRORS:-0} type error(s)."

      - name: bandit — security SAST
        id: bandit
        run: |
          # Run bandit on all source directories at once (for valid JSON)
          echo "Scanning with bandit..."
          bandit -r $SRC_DIR -ll -ii             --format json --output bandit-report.json || true
          bandit -r $SRC_DIR -ll -ii 2>&1 | tee bandit-output.txt || true
          BANDIT_ISSUES=$(grep -c ">> Issue" bandit-output.txt 2>/dev/null || echo "0")
          BANDIT_ISSUES=$(echo "$BANDIT_ISSUES" | tr -d '[:space:]')
          echo "bandit_issues=${BANDIT_ISSUES:-0}" >> "$GITHUB_OUTPUT"
          echo "Found ${BANDIT_ISSUES:-0} security issue(s)."

      - name: pip-audit — dependency CVE scan
        id: pip_audit
        run: |
          pip-audit --format json --output pip-audit-report.json || true
          pip-audit 2>&1 | tee pip-audit-output.txt || true
          PIP_AUDIT_VULNS=$(python3 -c "
          import json
          try:
              with open('pip-audit-report.json') as f:
                  data = json.load(f)
              if isinstance(data, dict):
                  data = data.get('dependencies', [])
              print(sum(1 for d in data if d.get('vulns')))
          except:
              print('0')
          " 2>/dev/null || echo "0")
          PIP_AUDIT_VULNS=$(echo "$PIP_AUDIT_VULNS" | tr -d '[:space:]')
          echo "pip_audit_vulns=${PIP_AUDIT_VULNS:-0}" >> "$GITHUB_OUTPUT"
          echo "Found ${PIP_AUDIT_VULNS:-0} vulnerable dependency(ies)."

      - name: radon — complexity report
        id: radon
        run: |
          echo "── Cyclomatic Complexity ────────────────────────────────────"
          # Run radon on all source directories at once (for valid JSON)
          echo "Analyzing with radon..."
          radon cc $SRC_DIR             --show-complexity --average --json > radon-cc-report.json || true
          radon cc $SRC_DIR             --min C --show-complexity --average 2>&1 | tee radon-cc-output.txt || true
          echo ""
          echo "── Maintainability Index ────────────────────────────────────"
          radon mi $SRC_DIR --json > radon-mi-report.json || true
          radon mi $SRC_DIR --show --min B || true
          RADON_COMPLEXITY=$(python3 -c "
          import json
          try:
              with open('radon-cc-report.json') as f:
                  data = json.load(f)
              high = sum(1 for file in data.values() for func in file if func.get('rank', '') in ('C', 'D', 'E', 'F'))
              print(high)
          except:
              print('0')
          " 2>/dev/null || echo "0")
          RADON_COMPLEXITY=$(echo "$RADON_COMPLEXITY" | tr -d '[:space:]')
          echo "radon_complexity=${RADON_COMPLEXITY:-0}" >> "$GITHUB_OUTPUT"
          echo "Found ${RADON_COMPLEXITY:-0} high-complexity function(s)."

      - name: vulture — dead code detection
        id: vulture
        run: |
          # Run vulture on each directory in SRC_DIR
          for dir in $SRC_DIR; do
            echo "Scanning $dir with vulture..."
            vulture "$dir"             --min-confidence 80 | tee -a vulture-report.txt || true
          done
          VULTURE_DEAD=$(wc -l < vulture-report.txt 2>/dev/null || echo "0")
          VULTURE_DEAD=$(echo "$VULTURE_DEAD" | tr -d '[:space:]')
          echo "vulture_dead=${VULTURE_DEAD:-0}" >> "$GITHUB_OUTPUT"
          echo "Found ${VULTURE_DEAD:-0} potential dead code location(s)."

      - name: interrogate — docstring coverage
        id: interrogate
        run: |
          # Run interrogate on each directory in SRC_DIR
          for dir in $SRC_DIR; do
            echo "Checking docstring coverage for $dir..."
            interrogate "$dir"             -v --fail-under=0 2>&1 | tee -a interrogate-output.txt || true
          done
          INTERROGATE_PCT=$(grep -oP '\d+%' interrogate-output.txt | tail -1 | tr -d '%' || echo "0")
          INTERROGATE_PCT=$(echo "$INTERROGATE_PCT" | tr -d '[:space:]')
          echo "interrogate_pct=${INTERROGATE_PCT:-0}" >> "$GITHUB_OUTPUT"
          echo "Docstring coverage: ${INTERROGATE_PCT:-0}%"

      - name: Write audit summary
        if: always()
        run: |
          python3 - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import re
          from pathlib import Path

          MAX = 50

          def section(title):
              print()
              print(f"### {title}")

          def show_list(items):
              if not items:
                  print("✅ No findings.")
                  return
              for it in items[:MAX]:
                  print(f"- {it}")
              if len(items) > MAX:
                  print(f"- … and {len(items) - MAX} more (see job log)")

          print("## 🔍 Audit findings (advisory — does not gate the run)")

          # mypy — file:line: error
          errors = []
          p = Path("mypy-output.txt")
          if p.exists():
              rx = re.compile(r"^(\S+\.py):(\d+): error: (.*)$")
              for line in p.read_text(errors="ignore").splitlines():
                  m = rx.match(line.strip())
                  if m:
                      errors.append(f"`{m.group(1)}:{m.group(2)}` — {m.group(3)}")
          section(f"🧩 Types (mypy, strict) — {len(errors)} error(s)")
          show_list(errors)

          # bandit — file:line [SEVERITY] test_id: text
          issues = []
          p = Path("bandit-report.json")
          if p.exists():
              try:
                  for r in json.loads(p.read_text(errors="ignore")).get("results", []):
                      issues.append(
                          f"`{r.get('filename', '?')}:{r.get('line_number', '?')}` "
                          f"[{r.get('issue_severity', '?')}] {r.get('test_id', '?')} — {r.get('issue_text', '')[:150]}"
                      )
              except Exception:
                  issues = ["(failed to parse bandit-report.json)"]
          else:
              issues = ["(no bandit report)"]
          section(f"🛡️ Security (bandit) — {len(issues)} issue(s)")
          show_list(issues)

          # semgrep — file:line rule: message
          findings = []
          p = Path("semgrep-report.json")
          if p.exists():
              try:
                  for r in json.loads(p.read_text(errors="ignore")).get("results", []):
                      loc = r.get("start", {}).get("line", "?")
                      findings.append(
                          f"`{r.get('path', '?')}:{loc}` {r.get('check_id', '?')} — "
                          f"{r.get('extra', {}).get('message', '')[:150]}"
                      )
              except Exception:
                  findings = ["(failed to parse semgrep-report.json)"]
          section(f"🔎 Semgrep — {len(findings)} finding(s)")
          show_list(findings)

          # pip-audit — package@version: vuln ids (fix versions)
          vulns = []
          p = Path("pip-audit-report.json")
          if p.exists():
              try:
                  data = json.loads(p.read_text(errors="ignore"))
                  if isinstance(data, dict):
                      data = data.get("dependencies", [])
                  for dep in data:
                      vs = dep.get("vulns", [])
                      if not vs:
                          continue
                      ids = ", ".join(v.get("id", "?") for v in vs)
                      fixes = "; ".join(", ".join(v.get("fix_versions", [])) or "none" for v in vs)
                      vulns.append(f"**{dep.get('name', '?')}@{dep.get('version', '?')}** — {ids} (fix: {fixes})")
              except Exception:
                  vulns = ["(failed to parse pip-audit-report.json)"]
          section(f"📦 Dependencies (pip-audit) — {len(vulns)} vulnerable package(s)")
          show_list(vulns)

          # radon — hot functions rank C+
          hot = []
          p = Path("radon-cc-report.json")
          if p.exists():
              try:
                  data = json.loads(p.read_text(errors="ignore"))
                  for fname, funcs in data.items():
                      for fn in funcs:
                          if fn.get("rank", "") in ("C", "D", "E", "F"):
                              hot.append(f"`{fname}:{fn.get('lineno', '?')}` — {fn.get('name', '?')}() rank {fn['rank']} (complexity {fn.get('complexity', '?')})")
              except Exception:
                  hot = ["(failed to parse radon-cc-report.json)"]
          section(f"📈 Complexity (radon, rank ≥C) — {len(hot)} hot function(s)")
          show_list(hot)

          # vulture — raw file:line entries
          dead = []
          p = Path("vulture-report.txt")
          if p.exists():
              dead = [l.strip() for l in p.read_text(errors="ignore").splitlines() if l.strip()]
          section(f"🧟 Dead code (vulture, conf ≥80%) — {len(dead)} candidate(s)")
          show_list(dead)

          # interrogate — coverage summary lines
          p = Path("interrogate-output.txt")
          lines = []
          if p.exists():
              lines = [l.strip() for l in p.read_text(errors="ignore").splitlines() if "Coverage:" in l]
          section("📝 Docstrings (interrogate) — per-directory coverage")
          if lines:
              for l in lines:
                  print(f"- `{l}`")
          else:
              print("(no coverage lines found)")
          PY

  # ── 4. FRONTEND TESTS (D-G — parallel to python tests, no needs) ──────────
  frontend-tests:
    name: "Frontend (typecheck · lint · vitest)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bet_dashboard/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: bet_dashboard/frontend
        run: npm ci

      - name: Type check
        working-directory: bet_dashboard/frontend
        run: npm run typecheck 2>&1 | tee typecheck-output.txt

      - name: Lint
        # Advisory initially: `eslint .` carries 21 pre-existing src/ errors
        # (documented cycle 9; none in test files). Pay down the debt, then
        # remove continue-on-error to make lint blocking.
        continue-on-error: true
        working-directory: bet_dashboard/frontend
        run: npx eslint . --format json --output-file eslint-report.json

      - name: Unit tests (vitest)
        # Standing vitest config (threads pool + isolate:false +
        # fileParallelism:false) is deterministic; CI runners are fast —
        # the 60s worker-start hazard documented in cycle 9/12 is a
        # constrained-container artifact, not a CI-runner risk.
        working-directory: bet_dashboard/frontend
        run: |
          mkdir -p test-results
          npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest-junit.xml

      - name: Write frontend summary
        if: always()
        working-directory: bet_dashboard/frontend
        run: |
          python3 - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          MAX = 60

          print("## 🖥️ Frontend — typecheck · lint · vitest")

          # typecheck
          p = Path("typecheck-output.txt")
          ts_errors = []
          if p.exists():
              ts_errors = [l.strip() for l in p.read_text(errors="ignore").splitlines() if "error TS" in l]
          print()
          print(f"### 🧩 Typecheck (tsc -b) — {len(ts_errors)} error(s)")
          if not ts_errors:
              print("✅ Clean.")
          else:
              for l in ts_errors[:MAX]:
                  print(f"- {l}")
              if len(ts_errors) > MAX:
                  print(f"- … and {len(ts_errors) - MAX} more")

          # eslint
          p = Path("eslint-report.json")
          problems = []
          if p.exists():
              try:
                  for f in json.loads(p.read_text(errors="ignore")):
                      for m in f.get("messages", []):
                          sev = "❌" if m.get("severity") == 2 else "⚠️"
                          fp = f.get("filePath", "?").replace(str(Path.cwd()) + "/", "")
                          problems.append(f"{sev} `{fp}:{m.get('line', '?')}` — {m.get('ruleId', '?')} — {m.get('message', '')[:150]}")
              except Exception:
                  problems = ["(failed to parse eslint-report.json)"]
          print()
          print(f"### 🧹 Lint (eslint) — {len(problems)} problem(s) — advisory until src/ debt is paid down")
          if not problems:
              print("✅ Clean.")
          else:
              for l in problems[:MAX]:
                  print(f"- {l}")
              if len(problems) > MAX:
                  print(f"- … and {len(problems) - MAX} more")

          # vitest junit
          p = Path("test-results/vitest-junit.xml")
          if p.exists():
              try:
                  root = ET.parse(p).getroot()
              except Exception:
                  root = None
          else:
              root = None
          print()
          if root is None:
              print("### ⚠️ Vitest — no junit results (crashed before write?)")
          else:
              agg = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              fails = []
              for ts in root.iter("testsuite"):
                  for k in agg:
                      agg[k] += int(ts.get(k, "0") or 0)
                  for tc in ts.iter("testcase"):
                      f = tc.find("failure")
                      e = tc.find("error")
                      if (f is None) and (e is None):
                          continue
                      el = f if f is not None else e
                      msg = el.get("message") or (el.text or "")
                      first = msg.strip().splitlines()[0] if msg.strip() else "(no message)"
                      fails.append((tc.get("classname", "?"), tc.get("name", "?"), first[:200]))
              passed = agg["tests"] - agg["failures"] - agg["errors"] - agg["skipped"]
              print(f"### 🧪 Vitest — {passed} passed, {agg['failures'] + agg['errors']} failed, {agg['skipped']} skipped (total {agg['tests']})")
              if fails:
                  print()
                  print("**Failing tests:**")
                  for cls, tname, first in fails[:MAX]:
                      print(f"- `{cls}::{tname}` — {first}")
                  if len(fails) > MAX:
                      print(f"- … and {len(fails) - MAX} more")
          PY

  # ── 5. E2E TESTS (blocking — real stack, PR code, local build) ───────────
  e2e-tests:
    name: "E2E (docker stack · playwright)"
    runs-on: ubuntu-latest
    needs: [test, frontend-tests]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bet_dashboard/frontend/package-lock.json

      - name: Install frontend deps + playwright browsers
        working-directory: bet_dashboard/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Build local E2E image (from PR code — never pushed, never pulled)
        run: docker compose -f setup/compose.e2e.yaml build

      - name: Start E2E stack (backend + frontend only)
        run: docker compose -f setup/compose.e2e.yaml up -d

      - name: Wait for health (nginx + backend answering /api/status on :3002)
        run: |
          timeout 180 bash -c '
            until curl -sf -o /dev/null http://localhost:3002/api/status; do
              echo "waiting for stack..."
              sleep 5
            done
          '

      - name: Run playwright tests (external stack)
        working-directory: bet_dashboard/frontend
        env:
          E2E_BASE_URL: "http://localhost:3002"
        run: npx playwright test

      - name: Write E2E summary
        if: always()
        working-directory: bet_dashboard/frontend
        run: |
          {
            echo "## 🌐 E2E — docker stack (backend + frontend, PR code, locally built)"
            echo ""
            echo "Stack: built locally from this PR's checkout (setup/compose.e2e.yaml) — no registry pull/push; ghcr.io is only ever touched by deploy.yml on main. Torn down at job end (down -v --rmi all)."
            echo ""
            if curl -sf -o /dev/null http://localhost:3002/api/status; then
              echo "Stack health: ✅ healthy — nginx + backend answering /api/status on :3002"
            else
              echo "Stack health: ❌ not answering — see the job log above"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path("test-results/e2e-junit.xml")
          if not p.exists():
              print("### ⚠️ Playwright — no junit results (tests never ran: build, health, or browser install failed — see job log)")
          else:
              try:
                  root = ET.parse(p).getroot()
              except Exception:
                  print("### ⚠️ Playwright — failed to parse e2e-junit.xml")
                  root = None
              if root is not None:
                  agg = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
                  fails = []
                  for ts in root.iter("testsuite"):
                      for k in agg:
                          agg[k] += int(ts.get(k, "0") or 0)
                      for tc in ts.iter("testcase"):
                          f = tc.find("failure")
                          e = tc.find("error")
                          if (f is None) and (e is None):
                              continue
                          el = f if f is not None else e
                          msg = el.get("message") or (el.text or "")
                          first = msg.strip().splitlines()[0] if msg.strip() else "(no message)"
                          fails.append((tc.get("classname", "?"), tc.get("name", "?"), first[:200]))
                  passed = agg["tests"] - agg["failures"] - agg["errors"] - agg["skipped"]
                  print(f"### 🧪 Playwright — {passed} passed, {agg['failures'] + agg['errors']} failed, {agg['skipped']} skipped (total {agg['tests']}) across chromium + firefox + webkit")
                  if fails:
                      print()
                      print("**Failing tests:**")
                      for cls, tname, first in fails:
                          print(f"- `{cls}::{tname}` — {first}")
          PY

      - name: Tear down E2E stack (always — nothing persists)
        if: always()
        run: docker compose -f setup/compose.e2e.yaml down -v --rmi all --remove-orphans

  # ── GATE (required: auto-fix, test, frontend-tests, e2e-tests) ────────────
  ci-gate:
    name: "CI Gate"
    if: always()
    needs: [auto-fix, test, audit, frontend-tests, e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Write run summary (verdict)
        if: always()
        run: |
          {
            echo "# 🚦 CI Verdict — run #${{ github.run_number }}"
            echo ""
            echo "${{ github.event_name }} on \`${{ github.ref_name }}\` — commit \`${{ github.sha }}\`"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Auto-fix | ${{ needs.auto-fix.result }} |"
            echo "| Tests (3 Python suites) | ${{ needs.test.result }} |"
            echo "| Frontend (typecheck · lint · vitest) | ${{ needs.frontend-tests.result }} |"
            echo "| E2E (docker stack · playwright) | ${{ needs.e2e-tests.result }} |"
            echo "| Audit (advisory) | ${{ needs.audit.result }} |"
            echo ""
            echo "### Audit key metrics (advisory — details in the Audit summary section)"
            echo ""
            echo "- mypy errors: **${{ needs.audit.outputs.mypy_errors }}**"
            echo "- bandit issues: **${{ needs.audit.outputs.bandit_issues }}**"
            echo "- semgrep findings: **${{ needs.audit.outputs.semgrep_findings }}**"
            echo "- pip-audit vulnerable packages: **${{ needs.audit.outputs.pip_audit_vulns }}**"
            echo "- radon hot functions: **${{ needs.audit.outputs.radon_complexity }}**"
            echo "- vulture dead-code candidates: **${{ needs.audit.outputs.vulture_dead }}**"
            echo "- docstring coverage: **${{ needs.audit.outputs.interrogate_pct }}%**"
            echo ""
            echo "Per-suite test results, failing tests, and audit findings with file:line"
            echo "are in the corresponding job summaries above on this page."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check required jobs passed
        run: |
          python3 -c "
          import sys

          required = {
              # auto-fix legitimately skips on PR events (push-only job)
              'auto-fix':       ('${{ needs.auto-fix.result }}', ('success', 'skipped')),
              'test':           ('${{ needs.test.result }}', ('success',)),
              'frontend-tests': ('${{ needs.frontend-tests.result }}', ('success',)),
              'e2e-tests':      ('${{ needs.e2e-tests.result }}', ('success',)),
          }
          failures = [n for n, (r, ok) in required.items() if r not in ok]
          if failures:
              print('BLOCKING failures in:', ', '.join(failures))
              sys.exit(1)
          print('All required jobs passed (auto-fix, test, frontend-tests, e2e-tests).')
          print('Audit result (advisory):', '${{ needs.audit.result }}')
          "
