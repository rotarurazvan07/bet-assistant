# Auto-merge Dependabot PATCH updates only, once required CI checks pass.

name: Dependabot auto-merge (patches)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Least privilege needed to merge a PR.
permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # Never run for fork PRs; only the bot itself.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Verify metadata fetch succeeded
        if: steps.meta.outcome != 'success'
        run: |
          echo "::error::dependabot/fetch-metadata failed; cannot determine update type/group. Failing closed."
          exit 1

      - name: Gate on update-type and group (fail closed)
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPENDENCY_GROUP: ${{ steps.meta.outputs.dependency-group }}
        run: |
          set -u

          echo "update-type=${UPDATE_TYPE:-<unset>}"
          echo "dependency-group=${DEPENDENCY_GROUP:-<unset>}"

          # AC-07: only the patches group, and only a semver patch bump, may proceed.
          if [[ "${UPDATE_TYPE:-}" == "version-update:semver-patch" &&
                "${DEPENDENCY_GROUP:-}" == "patches" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Patch group confirmed eligible for auto-merge."
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Not eligible (minor/major/ungrouped/ambiguous) - skipping without merge."
          fi

      - name: Wait for required checks (with timeout)
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        timeout-minutes: 10
        run: |
          # Blocks until every check completes; non-zero if any required check fails.
          gh pr checks "$PR" \
            --watch \
            --required \
            --fail-fast=3 \
            --interval 30

      - name: Re-confirm head commit unchanged
        if: steps.gate.outputs.eligible == 'true'
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u

          CURRENT_SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)

          echo "event=$EVENT_SHA current=$CURRENT_SHA"

          if [ "$EVENT_SHA" = "$CURRENT_SHA" ]; then
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Head moved during checks - skipping merge."
          fi

      - name: Squash-merge patch PR
        if: >-
          steps.gate.outputs.eligible == 'true' &&
          steps.head.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ steps.head.outputs.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          gh pr merge "$PR" \
            --squash \
            --match-head-commit "$SHA" \
            --subject "${TITLE} (#${PR})" \
            --body "Auto-merged by dependabot-auto-merge: patches group, all required checks green at ${SHA}."
