version: 2

updates:
  # ----------------------------------------------------------- GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Bucharest"

    open-pull-requests-limit: 10

    groups:
      github-actions-non-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

      github-actions-majors:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"

  # --------------------------------------------------------------------- npm
  - package-ecosystem: "npm"
    directory: "/bet_dashboard/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Bucharest"

    open-pull-requests-limit: 10

    groups:
      # These packages frequently have interconnected peer-dependency
      # constraints and should be resolved in the same update.
      npm-typescript-tooling:
        applies-to: "version-updates"
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "eslint"
          - "@eslint/*"
          - "openapi-typescript"
          - "vite"
          - "@vitejs/*"
        update-types:
          - "patch"
          - "minor"
          - "major"

      npm-patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "eslint"
          - "@eslint/*"
          - "openapi-typescript"
          - "vite"
          - "@vitejs/*"
        update-types:
          - "patch"

      npm-minors:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "eslint"
          - "@eslint/*"
          - "openapi-typescript"
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"

      npm-majors:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "eslint"
          - "@eslint/*"
          - "openapi-typescript"
          - "vite"
          - "@vitejs/*"
        update-types:
          - "major"

  # ------------------------------------------------------------- Backend pip
  - package-ecosystem: "pip"
    directory: "/bet_dashboard/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Bucharest"

    open-pull-requests-limit: 10

    groups:
      backend-pip-patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"

      backend-pip-minors:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"

      backend-pip-majors:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"

  # --------------------------------------------------------------- Setup pip
  - package-ecosystem: "pip"
    directory: "/setup"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Bucharest"

    open-pull-requests-limit: 10

    groups:
      setup-pip-non-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

      setup-pip-majors:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
