version: 2

updates:
  # ---------------------------------------------------------------- GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 10

    groups:
      patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch

      minors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor

      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  # ------------------------------------------------------------------------- npm
  - package-ecosystem: "npm"
    directory: "/bet_dashboard/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 10

    groups:
      patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch

      minors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor

      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  # ------------------------------------------------------------------------- pip
  - package-ecosystem: "pip"
    directory: "/bet_dashboard/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 10

    groups:
      patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch

      minors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor

      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: "pip"
    directory: "/setup"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 10

    groups:
      patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch

      minors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor

      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
