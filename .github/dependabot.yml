version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/bet_dashboard/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
    groups:
      npm:
        patterns:
          - "*"
