version: 2
updates:
  # Python (backend + crawler + framework share this ecosystem at repo root)
  - package-ecosystem: pip
    directory: /bet_dashboard/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /setup
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Frontend npm
  - package-ecosystem: npm
    directory: /bet_dashboard/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
