# Web Scraper settings
# Per-HTTP-status retry budgets (scrape-kit v0.3.0 fetcher; merges over built-in 403/429/503)
status_retries:
  429: 10
  503: 10

retry_indicators:
  - "403 Forbidden"
  - "429 Too Many Requests"
block_indicators:
  - "Just a moment"
  - "Checking your browser"
  - "cf-browser-verification"

# Matches filtering settings
num_days_ahead: 1
local_timezone: "Europe/Bucharest"

SKIP_PATTERNS:
  - pattern: "\\bU\\d{2}s?\\b"
    description: "Youth team"
  - pattern: "\\bW\\b"
    description: "Women's team"
  - pattern: "\\bII\\b"
    description: "Reserve team II"
  - pattern: "\\b2\\b"
    description: "Reserve team 2"
  - pattern: "\\bIII\\b"
    description: "Reserve team III"
  - pattern: "\\bB\\b"
    description: "B team"
  - pattern: "\\bC\\b"
    description: "C team"
  - pattern: "\\b(Am)\\b"
    description: "Amateur"
  - pattern: "\\bRes\\b"
    description: "Reserve team"

