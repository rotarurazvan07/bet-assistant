name: bet-assistant

networks:
  lab_net:
    external: true

# ── Extension Templates ──────────────────────────────────────────────────────
x-runner-base: &runner-base
  image: ghcr.io/rotarurazvan07/bet-assistant-runner:latest
  restart: unless-stopped
  environment:
    GITHUB_OWNER: "${GITHUB_OWNER}"
    GITHUB_REPO: "${GITHUB_REPO}"
    ACCESS_TOKEN: "${ACCESS_TOKEN}"
    RUNNER_NAME_PREFIX: "bet-runner"
    LABELS: "bet-runner"
    TZ: "Europe/Bucharest"
  labels:
    - "com.centurylinklabs.watchtower.enable=true"

# ── Services Matrix ─────────────────────────────────────────────────────────
services:
  app:
    image: ghcr.io/rotarurazvan07/bet-assistant:latest
    container_name: bet-assistant
    restart: unless-stopped
    environment:
      - MATCHES_DB_PATH=/app/workspace/data/matches.db
      - SLIPS_DB_PATH=/app/workspace/data/slips.db
      - CONFIG_PATH=/app/workspace/config
      - PYTHONPATH=/app
      - TZ=Europe/Bucharest
    volumes:
      - ./workspace:/app/workspace
    ports:
      - "${BET_ASSISTANT_PORT}:80"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/api/status')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lab_net

  # ── GITHUB ACTIONS SELF-HOSTED RUNNERS ────────────────────────────────────
  runner:
    <<: *runner-base
    deploy:
      replicas: 1
    networks:
      - lab_net
